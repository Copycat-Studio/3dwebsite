<!doctype html>
<html lang="en">
  <head>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="./style.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
      
      .progress-bar-container {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        background-color:wheat;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      #progress-bar {
        width: 30%;
        margin-top: 0.5%;
        height: 3%;
        transition: all 2s ease-in-out;
  border-radius: 10px;
  overflow: hidden;
  background-color: black;
      }
      
      
#progress-bar::-webkit-progress-value {
  background-color: #f89b27;
}

#progress-bar::-webkit-progress-bar {
  background-color: #a4238a;
}
      

      label {
        color: black;
        font-size: 1.5rem;
        font-family: 'Orbitron', sans-serif;
      }

.caption-text {
  font-size: 0.8rem;
  color: #33012b;
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  opacity: 1; /* Max opacity */
  margin-top: 0.5rem;
}

      canvas {
        display: block;
      }

       @media (max-width: 768px) {
    #reset-btn {
      position: fixed;
      top: unset !important;
      bottom: 3rem !important;
      right: 1rem !important;
      left: 50%;
      font-size: 0.9rem !important;
      padding: 0.5rem 0.8rem !important;
      transform: translateX(-50%);
    }
  }

  .loading-logo {
  width: 150px;
  height: auto;
  margin-bottom: 1rem; /* 👈 THIS adds space to label below */
  animation: pulse 2s ease-in-out infinite;
  user-select: none;
  pointer-events: none;
}

.caption-subtext {
  font-size: 1rem;
  color: #33012b;
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  opacity: 1;
  margin-top: 3rem;
}


      }
    </style>
    <script type="module" crossorigin src="/assets/index-BhWWutCY.js"></script>
  </head>

  
  <body>


<div class="progress-bar-container">
        <img src="/logo.png" alt="Loading Logo" class="loading-logo" />
        <label for="progress-bar" id="progress-label">preparing...</label>
        <progress id="progress-bar" value="0" max="100"></progress>
        <p id="progress-caption" class="caption-text">Waiting for assets...</p>
        <p id="progress-subcaption" class="caption-subtext">open this website at desktop, to get full experience</p>
    </div>

<div id="hood-caption" style="
  position: fixed;
  pointer-events: none;
  background: rgba(0, 0, 0, 0.65);
  color: #00f5cc;
  padding: 4px 8px;
  font-size: 10px;
  border-radius: 4px;
  font-family: 'Orbitron', sans-serif;
  z-index: 9999;
  display: none;
">
  click to open
</div>

<button id="reset-btn" style="
  display: none;
  position: fixed;
  top: 1rem;
  right: 1rem;
  padding: 0.6rem 1rem;
  font-size: 1rem;
  font-family: 'Orbitron', sans-serif;
  background: rgba(0,0,0,0.85);
  color: #00f5cc;
  border: 1px solid #00f5cc;
  border-radius: 5px;
  cursor: pointer;
  z-index: 9999;
  touch-action: manipulation;
">
  BACK
</button>
