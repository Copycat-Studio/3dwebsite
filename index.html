<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Copycat 3D Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" />
    <style>
      html, body {       
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
      
      .progress-bar-container {
        cursor: none;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        background-color:wheat;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999999;
      }

      #progress-bar {
        width: 30%;
        margin-top: 0.5%;
        height: 3%;
        transition: all 2s ease-in-out;
  border-radius: 10px;
  overflow: hidden;
  background-color: black;
      }
    
      
#progress-bar::-webkit-progress-value {
  background-color: #f89b27;
}

#progress-bar::-webkit-progress-bar {
  background-color: #a4238a;
}
      

      label {
        color: black;
        font-size: 1.5rem;
        font-family: 'Orbitron', sans-serif;
      }

.caption-text {
  font-size: 0.8rem;
  color: #33012b;
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  opacity: 1; /* Max opacity */
  margin-top: 0.5rem;
}

      canvas {
        display: block;
      }

       @media (max-width: 768px) {
    #reset-btn {
      position: fixed;
      top: unset !important;
      bottom: 3rem !important;
      right: 1rem !important;
      left: 50%;
      font-size: 0.9rem !important;
      padding: 0.5rem 0.8rem !important;
      transform: translateX(-50%);
    }
  }

#custom-cursor {
      position: fixed;
      width: 84px;
      height: 84px;
      pointer-events: none;
      z-index: 999999;
      background: url('/cursor.png') no-repeat center center;
      background-size: contain;
      transform: translate(-50%, -50%);
      }

      #custom-pointer {
      display: none;
      position: fixed;
      width: 84px;
      height: 84px;
      background: #00f5cc;
      border-radius: 50%;
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      }

      #custom-cursor.pointer {
        background-image: url('/pointer.png');
      }

      #custom-cursor.ibeam {
  background-image: url('/ibeam.png');
}


  
      .shoe-background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('/assets/shoe-bg.jpg'); /* Change to your path */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: 9991; /* 🔑 Push below the WebGL canvas */
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none; /* Ensure it doesn’t block mouse/touch */
}
.shoe-background.active {
  opacity: 1;
}

  .loading-logo {
  width: 150px;
  height: auto;
  margin-bottom: 1rem; /* 👈 THIS adds space to label below */
  animation: pulse 2s ease-in-out infinite;
  user-select: none;
  pointer-events: none;
}

#help-img-bottom {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  width: 654px;
  height: auto;
  z-index: 9995;
  justify-content: center;
  pointer-events: none;
  object-fit: contain;
}

#help-img-center {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 600px;
  height: auto;
  z-index: 9995;
  pointer-events: none;
}
#help-img-center img {
  width: 100%;
  height: auto;
}


.caption-subtext {
  font-size: 1rem;
  color: #33012b;
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  opacity: 1;
  margin-top: 3rem;
}

.bottom-menu {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  justify-content: center;
  gap: .4rem;
  z-index: 9990;
  pointer-events: auto;
  padding: 0 1rem;
  flex-wrap: nowrap;
}

.menu-btn {
  width: 15vw;
  height: auto;
  max-width: 100px;
  object-fit: contain;
  cursor: none;
  transition: transform 0.2s ease;
  touch-action: manipulation;
}

@media (min-width: 768px) {
  .menu-btn {
    width: 100px;
    height: auto;
    pointer-events: auto !important;
    cursor: none;
  }
}
.menu-btn.disabled {
  opacity: 0.3;
  pointer-events: none;
  filter: grayscale(100%);
}

.menu-btn:hover {
  transform: scale(1.1);
}

#email-form-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  z-index: 100000;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 1rem;
  box-sizing: border-box;
  cursor: none !important;
}

#email-form {
  background: #1c1c1c;
  padding: 2rem;
  border-radius: 12px;
  width: 100%;
  max-width: 500px;
  z-index: 100005;
  color: white;
  font-family: 'Orbitron', sans-serif;
  box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
  pointer-events: auto;
  cursor: none;
  touch-action: manipulation;
}

#email-form h2 {
  margin-bottom: 1rem;
  font-size: 1.5rem;
  text-align: center;
  color: #00f5cc;
  cursor: none;
}

#email-form label {
  display: block;
  margin: 0.5rem 0 0.2rem;
  font-size: 0.9rem;
  font-family: inherit;
  color: #fff;
  cursor: none;
}

#email-form input,
#email-form textarea {
  z-index: 100006;
  width: 100%;
  padding: 0.7rem;
  border-radius: 6px;
  border: none;
  margin-bottom: 0.8rem;
  font-size: 1rem;
  font-family: default;
  background: #2b2b2b;
  color: #fff;
  box-sizing: border-box;
  cursor: none;
}


#email-form textarea {
  height: 6rem;
  resize: vertical;
}

#email-form .form-actions {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 1rem;
  cursor: none;
}

#email-form button {
  flex: 1;
  padding: 0.8rem;
  font-size: 1rem;
  font-family: inherit;
  background-color: #00f5cc;
  color: #000;
  border: none;
  border-radius: 6px;
  transition: background-color 0.2s ease;
  cursor: none;
}

#email-form button:hover {
  background-color: #00cfa4;
  font-family: inherit;
}

#email-form button#form-cancel {
  background-color: #888;
  color: rgb(0, 0, 0);
  font-family: inherit;
}

#email-form button#form-cancel:hover {
  background-color: #555;
}

@media (max-width: 480px) {
  #email-form {
    padding: 1.5rem;
    font-size: 0.9rem;
  }

  #email-form h2 {
    font-size: 1.2rem;
  }

  #email-form button {
    font-size: 0.9rem;
  }
}


@media (max-width: 768px) {
  .bottom-menu {
    bottom: 4rem;
  }
}


@media (max-width: 768px) {
  #help-img-center {
    width: 98vw;
    height: auto;
  }
  #help-img-bottom{
    width: 98vw;
    height: auto;
    bottom: 4.3rem;
  }
}

@media (max-width: 768px) {
  #custom-cursor,
  #custom-pointer,
  .caption-text {
    display: none !important;
  }
}




      }
    </style>

<script>
  if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('#email-form input, #email-form textarea, #email-form button')
        .forEach(el => {
          el.style.cursor = 'auto';
          el.style.touchAction = 'manipulation';
          el.style.pointerEvents = 'auto';
        });
    });
  }
</script>
