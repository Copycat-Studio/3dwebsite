<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copycat 3D Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" />
    <style>
      html, body {       
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
      
      .progress-bar-container {
        cursor: none;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        background-color:wheat;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
      }

      #progress-bar {
        width: 30%;
        margin-top: 0.5%;
        height: 3%;
        transition: all 2s ease-in-out;
  border-radius: 10px;
  overflow: hidden;
  background-color: black;
      }
      
        * {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
      
#progress-bar::-webkit-progress-value {
  background-color: #f89b27;
}

#progress-bar::-webkit-progress-bar {
  background-color: #a4238a;
}
      

      label {
        color: black;
        font-size: 1.5rem;
        font-family: 'Orbitron', sans-serif;
      }

.caption-text {
  font-size: 0.8rem;
  color: #33012b;
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  opacity: 1; /* Max opacity */
  margin-top: 0.5rem;
}

      canvas {
        display: block;
      }

       @media (max-width: 768px) {
    #reset-btn {
      position: fixed;
      top: unset !important;
      bottom: 3rem !important;
      right: 1rem !important;
      left: 50%;
      font-size: 0.9rem !important;
      padding: 0.5rem 0.8rem !important;
      transform: translateX(-50%);
    }
  }

#custom-cursor {
      position: fixed;
      width: 84px;
      height: 84px;
      pointer-events: none;
      z-index: 9999;
      background: url('/cursor.png') no-repeat center center;
      background-size: contain;
      transform: translate(-50%, -50%);
      }

      #custom-pointer {
      display: none;
      position: fixed;
      width: 84px;
      height: 84px;
      background: #00f5cc;
      border-radius: 50%;
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      }

      #custom-cursor.pointer {
        background-image: url('/pointer.png');
      }
  
      .shoe-background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('/assets/shoe-bg.jpg'); /* Change to your path */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: 9991; /* 🔑 Push below the WebGL canvas */
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none; /* Ensure it doesn’t block mouse/touch */
}
.shoe-background.active {
  opacity: 1;
}




  .loading-logo {
  width: 150px;
  height: auto;
  margin-bottom: 1rem; /* 👈 THIS adds space to label below */
  animation: pulse 2s ease-in-out infinite;
  user-select: none;
  pointer-events: none;
}

.caption-subtext {
  font-size: 1rem;
  color: #33012b;
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  opacity: 1;
  margin-top: 3rem;
}

.bottom-menu {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  justify-content: center;
  gap: 1rem;
  z-index: 9990;
  pointer-events: auto;
  padding: 0 1rem;
  flex-wrap: nowrap;
}

.menu-btn {
  width: 15vw;              /* Responsive size based on screen width */
  max-width: 128px;          /* Prevent from getting too big on tablets */
  height: auto;
  cursor: none;
  object-fit: contain;
  transition: transform 0.2s ease;
  touch-action: manipulation;
}

.menu-btn:hover {
  transform: scale(1.1);
}

@media (min-width: 768px) {
  .menu-btn {
    width: 80px;
    max-width: 100px;
  }
}



      }
    </style>
    <script type="module" crossorigin src="/assets/index-C_TECUow.js"></script>
  </head>

  
  <body>

    <div id="custom-cursor"></div>
    <div id="custom-pointer"></div>
    <div id="shoe-bg" class="shoe-background"></div>

  $$$<img class="menu-btn" data-hitbox="hitbox_table" src="/textures/button_contact.png" />

$$$$</div>



<div class="progress-bar-container">
        <img src="/logo.png" alt="Loading Logo" class="loading-logo" />
        <label for="progress-bar" id="progress-label">preparing...</label>
        <progress id="progress-bar" value="0" max="100"></progress>
        <p id="progress-caption" class="caption-text">Waiting for assets...</p>
        <p id="progress-subcaption" class="caption-subtext">open this website at desktop, to get full experience</p>
    </div>



<div id="hood-caption" style="

">

  top: 1rem;
  right: 1rem;
  width: 120px;
  height: auto;
  cursor: none;
  z-index: 9995;
  touch-action: manipulation;
  pointer-events: auto;
" />

</html>
